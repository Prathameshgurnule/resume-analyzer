name: Resume Analyzer CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/resumeanalyzer/resumeanalyzer

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        run: ./mvnw clean verify


  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/frontend/resume-analyzer-ui

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontend/resume-analyzer-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build



  docker:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend JAR
        working-directory: backend/resumeanalyzer/resumeanalyzer
        run: ./mvnw clean package -DskipTests

      - name: Build backend Docker image
        run: |
          docker build \
            -t resume-backend:latest \
            ./backend/resumeanalyzer/resumeanalyzer

      - name: Build frontend Docker image
        run: |
          docker build \
            -t resume-frontend:latest \
            ./frontend/frontend/resume-analyzer-ui

      - name: Show Docker images
        run: docker images

